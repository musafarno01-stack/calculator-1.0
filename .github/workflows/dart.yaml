
name: Smart Calculator Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.0"
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check Android project files
        run: |
          echo "Android project files:"
          find android -maxdepth 5 -type f -print
          echo "Checking app Gradle files:"
          ls -l android/app/build.gradle android/app/build.gradle.kts 2>&1 || true
          echo "Checking root Gradle files:"
          ls -l android/build.gradle android/build.gradle.kts 2>&1 || true

      - name: Diagnose Android manifest
        run: |
          echo "Checking Android manifest files..."
          find android -name AndroidManifest.xml -print
          echo "Checking app manifest contents..."
          cat android/app/src/main/AndroidManifest.xml
          echo "Checking legacy embedding references..."
          grep -RInE 'io\.flutter\.app\.|PluginRegistry\.Registrar|flutterEmbedding.*1' android || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-calculator-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
