
name: Smart Calculator Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.0"
          cache: true

      - name: Regenerate missing Android project files
        run: flutter create --platforms=android .

      - name: Verify Android Gradle files
        run: |
          find android -maxdepth 4 -type f -print
          test -f android/app/build.gradle -o -f android/app/build.gradle.kts
          test -f android/gradlew

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=USE_TEST_ADS=false \
            --dart-define=ADMOB_ANDROID_APP_ID=ca-app-pub-9045925293510194~1561102409

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
