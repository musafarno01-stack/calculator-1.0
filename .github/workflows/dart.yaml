
name: Smart Calculator Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.0"
          cache: true

      - name: Regenerate missing Android project files
        run: flutter create --platforms=android .

      - name: Get packages
        run: flutter pub get

      - name: Build release APK with my AdMob IDs
        run: |
          flutter build apk --release \
            --dart-define=USE_TEST_ADS=false \
            --dart-define=ADMOB_ANDROID_APP_ID=ca-app-pub-9045925293510194~1561102409

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
